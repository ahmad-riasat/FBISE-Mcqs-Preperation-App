<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | EduPrep</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="logo-area">
      <div class="logo-box" aria-hidden="true">EP</div>
      <div>
        <h1 class="company-name">EduPrep</h1>
        <p class="slogan">Prepare before you appear in exam</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="quiz-card" aria-labelledby="login-heading">
      <h2 id="login-heading">Sign in</h2>
      <p>Use your roll number and password to start practising.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-roll">Roll number</label>
          <input type="text" id="login-roll" name="roll_number" inputmode="numeric"
                 pattern="[0-9]{6}" minlength="6" maxlength="6" required
                 autocomplete="username" aria-describedby="login-roll-error">
          <small class="error-msg" id="login-roll-error" aria-live="polite"></small>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" maxlength="72" required
                 autocomplete="current-password" aria-describedby="login-password-error">
          <small class="error-msg" id="login-password-error" aria-live="polite"></small>
        </div>

        <p id="login-status" role="alert"></p>

        <button type="submit" id="login-btn" class="btn btn-primary" disabled>Loading…</button>
      </form>

      <p class="paper-note">Demo account: 100001 / Demo@1234</p>
    </section>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 EduPrep. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
